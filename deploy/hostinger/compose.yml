services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${AZM_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: ${AZM_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REALTIME_REDIS_URL: redis://redis:6379/1
    command: ["sh", "-c", "python manage.py migrate --noinput && exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': os.environ['AZM_DOMAIN'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--hostname=worker@%h"]
    env_file: ${AZM_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REALTIME_REDIS_URL: redis://redis:6379/1
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  beat:
    build:
      context: ../../backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid"]
    env_file: ${AZM_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REALTIME_REDIS_URL: redis://redis:6379/1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile.web
    restart: unless-stopped
    env_file: ${AZM_ENV_FILE:-.env}
    environment:
      AZM_DOMAIN: ${AZM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  logs_data:
  caddy_data:
  caddy_config:
